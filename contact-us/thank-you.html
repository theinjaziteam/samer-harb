<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank You — Samer Harb</title>
  <link rel="icon" href="https://img1.wsimg.com/isteam/ip/444b8d38-19da-4b89-bf4c-bb2ec2c3c6d1/logo/a260a6c7-3ef4-40ab-bab9-99ee7f8ea3c9.jpeg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root{
      --blue:#1c69d4;--blue-dark:#0653b6;--dark:#1a2129;
      --ink:#262626;--body:#3c3c3c;--muted:#6b6b6b;--soft:#9a9a9a;
      --line:#e6e6e6;--white:#ffffff;--off:#f7f7f7;
      --font:'Inter',system-ui,sans-serif;--ease-out:cubic-bezier(0.16,1,0.3,1);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font);background:var(--dark);color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .ty-wrap{text-align:center;max-width:580px;padding:48px 24px;opacity:0}
    .ty-icon{width:80px;height:80px;border:2px solid var(--blue);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 32px;color:var(--blue);font-size:32px}
    .ty-eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--blue);margin-bottom:20px}
    h1{font-size:clamp(36px,5vw,56px);font-weight:700;line-height:1.05;margin-bottom:20px}
    h1 em{color:var(--blue);font-style:normal}
    p{font-size:17px;font-weight:300;line-height:1.7;color:rgba(255,255,255,0.6);margin-bottom:40px}
    .ty-btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
    .btn-primary{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--white);background:var(--blue);padding:16px 32px;text-decoration:none;transition:background .2s,transform .2s}
    .btn-primary:hover{background:var(--blue-dark);transform:translateY(-2px)}
    .btn-ghost{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.2);padding:16px 32px;text-decoration:none;transition:border-color .2s,color .2s,transform .2s}
    .btn-ghost:hover{border-color:rgba(255,255,255,0.6);color:var(--white);transform:translateY(-2px)}
    .m-stripe{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#0066b1 0%,#1c69d4 50%,#e22718 100%)}
    .countdown{font-size:12px;color:rgba(255,255,255,0.3);margin-top:32px}
  </style>
</head>
<body>
  <div class="m-stripe"></div>
  <div class="ty-wrap" id="tyWrap">
    <div class="ty-icon">✓</div>
    <div class="ty-eyebrow">Message Received</div>
    <h1>Thank You for<br>Reaching <em>Out</em></h1>
    <p>Your consultation request has been sent successfully. I'll review your message and get back to you within 24–48 business hours.</p>
    <div class="ty-btns">
      <a href="/" class="btn-primary">Back to Home ↗</a>
      <a href="/about-us" class="btn-ghost">Learn More About Me</a>
    </div>
    <p class="countdown" id="countdown">Redirecting to home in <span id="countNum">10</span> seconds…</p>
  </div>

  <script>
    gsap.to('#tyWrap', { opacity:1, y:0, duration:1, ease:'power3.out', delay:0.2 });
    gsap.from('#tyWrap', { y:40 });

    let count = 10;
    const el = document.getElementById('countNum');
    const interval = setInterval(() => {
      count--;
      el.textContent = count;
      if (count <= 0) {
        clearInterval(interval);
        window.location.href = '/';
      }
    }, 1000);
  </script>
</body>
</html>
